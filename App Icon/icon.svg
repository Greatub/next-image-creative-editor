<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!-- NICE app icon v1.8.1 (from v1.8.0): equal C-to-bottom-line clearance (~28px each side), wider C-to-E gap (~32px), wider E-to-body gap (30px). -->
  <rect width="1000" height="1000" rx="225" fill="#FAF9F6" />

  <!-- Camera body outline and inner lens ring (#6B7280) -->
  <g fill="none" stroke="#6B7280" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top-left corner (R50); the n stem forms the left side -->
    <path d="M 140 368 L 140 360 A 50 50 0 0 1 190 310 L 255 310" stroke-width="20" />
    <!-- Top plate with prism hump, right side moved out to x=870, R50 corners -->
    <path d="M 375 310 L 460 310 L 500 250 L 640 250 L 680 310 L 820 310 A 50 50 0 0 1 870 360 L 870 665 A 50 50 0 0 1 820 715 L 730 715" stroke-width="20" />
    <!-- Bottom-left line, ends ~28px clear of the C -->
    <line x1="140" y1="715" x2="396" y2="715" stroke-width="20" />
    <!-- Inner lens ring (center 570,535) -->
    <circle cx="570" cy="535" r="142" stroke-width="10" />
  </g>

  <!-- Letters n i C E (stroke 36, centered on y=535) -->
  <g fill="none" stroke="#1E2732" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
    <!-- n -->
    <line x1="140" y1="415" x2="140" y2="655" />
    <path d="M 140 470 A 55 55 0 0 1 250 470 L 250 655" />
    <!-- i; the dot sits in the top-plate gap as the shutter button -->
    <line x1="315" y1="415" x2="315" y2="655" />
    <circle cx="315" cy="310" r="18" fill="#1E2732" stroke="none" />
    <!-- C: center 570,535, R195, opening +/-40 degrees -->
    <path d="M 719.4 409.7 A 195 195 0 1 0 719.4 660.3" />
    <!-- E: spine on the same R195 circle, arms at +/-20 degrees -->
    <path d="M 812.0 468.3 L 753.2 468.3 A 195 195 0 0 1 753.2 601.7 L 812.0 601.7" />
    <line x1="765.0" y1="535.0" x2="812.0" y2="535.0" />
  </g>
</svg>
